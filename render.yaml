# Render Blueprint for the hosted demo. FREE plans only; autoDeploy is off so every deploy is deliberate.
# Free Postgres expires 30 days after creation (then a 14-day grace period). The demo holds only synthetic,
# short-lived workspaces, so expiry loses nothing that matters; recreate the database and redeploy (docs/DEPLOY.md).
services:
  - type: web
    name: watchshift
    runtime: docker
    region: frankfurt   # same region as the database: the internal connection string only resolves there
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: watchshift-db
          property: connectionString
      - key: WATCHSHIFT_PG_SCHEMA
        value: watchshift
      - key: WATCHSHIFT_TRUST_PROXY_HOPS   # Render's proxy appends the client address; only that entry is trusted
        value: "1"
databases:
  - name: watchshift-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
